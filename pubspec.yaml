name: slurm_cluster_monitor
description: 多集群 Slurm 作业、配额与节点状态 Android 监控应用。
publish_to: none
version: 1.9.0+16
environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dartssh2: ^4.1.0
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.3
  flutter_local_notifications: ^22.3.2
  flutter_foreground_task: ^11.0.3
  home_widget: ^0.10.0
  provider: ^6.1.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2
flutter:
  uses-material-design: true
